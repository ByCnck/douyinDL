[project]
name = "douyindl"
version = "0.1.0"
description = "抖音视频/合集下载工具"
authors = [
    { name = "ByCnck", email = "cnck2011@126.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "f2>=0.0.1.7",
    "loguru>=0.7.3",
    "pyyaml>=6.0",
]

# f2 锁定了 httpx==0.27.2 / rich==13.9.3 / lxml 等版本，由 f2 统一管理
# pyyaml 用于读取 config/config.yaml 配置文件

[project.scripts]
douyindl = "douyindl:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
